// logic: the game's rules in pure Java, shared with tests and the simulator (TRD §2.3).
plugins {
    id 'java-library'
}

dependencies {
    // JUnit 5 — the latest 5.x on 2026-11-24. JUnit 6 needs Java 17; the TRD compiles for Java 8.
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
