// android: the app that ships on Google Play (TRD §2.3).
import com.android.build.api.artifact.SingleArtifact

plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.rameshkumark24.bazaarboss'
    compileSdk = 36

    defaultConfig {
        // Permanent: a Play app ID can never change (TRD §11, decision 4).
        applicationId = 'io.github.rameshkumark24.bazaarboss'
        minSdk = 24       // Android 7.0 (PRD F20)
        targetSdk = 36    // Play's requirement since 31 Aug 2026 (TRD [T10])
        versionCode = 1
        versionName = '0.0.1'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [layout.buildDirectory.dir('gdx-natives').get().asFile]
            // The baked assets: fonts, icons and the content pack, built by tools (LLD §1.2)
            assets.srcDirs = [rootProject.file('assets')]
        }
    }

    buildTypes {
        debug {
            // A debug build installs beside the Play build, with its own name (EDGE-CASES BR-5).
            // A FileProvider's authority must come from ${applicationId}, never written out.
            applicationIdSuffix = '.dev'
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

configurations {
    natives
    // The merged-manifest guard's code, from tools (TRD §4.11). It runs at build time and never ships.
    manifestGuard {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
}

dependencies {
    implementation project(':core')
    // The dev tools exist in debug builds only (LLD §1); src/release has a no-op hook.
    debugImplementation project(':devtools')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    manifestGuard project(':tools')
}

// The merged-manifest guard (TRD §4.11, EDGE-CASES BR-1): after each variant's manifest merge, it fails the
// build if the app asks for a permission off the allowlist, or exports anything but the launcher and AndroidX's
// ProfileInstallReceiver behind DUMP. It reads the merged manifest, so a library's additions count too (H4-1).
androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
        def manifest = variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE)
        def applicationId = variant.applicationId
        def guard = tasks.register("check${name}MergedManifest", JavaExec) {
            group = 'verification'
            description = "Checks the ${variant.name} merged manifest's permissions and exports (TRD §4.11)."
            classpath = configurations.manifestGuard
            defaultCharacterEncoding = 'UTF-8'
            mainClass = 'io.github.rameshkumark24.bazaarboss.tools.guards.ManifestGuard'
            inputs.file(manifest).withPropertyName('mergedManifest')
            argumentProviders.add({
                [variant.name, applicationId.get(), manifest.get().asFile.absolutePath]
            } as CommandLineArgumentProvider)
        }
        tasks.named('check') {
            dependsOn guard
        }
    }
}

// libGDX ships its native library inside jars, one per CPU type (ABI).
// This task unpacks each into the folder the Android build packages.
abstract class CopyGdxNatives extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getNativeJars()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject
    abstract FileSystemOperations getFs()

    @javax.inject.Inject
    abstract ArchiveOperations getArchives()

    @TaskAction
    void copyNatives() {
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
            File jar = nativeJars.files.find { it.name.endsWith("natives-${abi}.jar") }
            if (jar == null) {
                throw new GradleException("Missing the libGDX natives for ${abi}")
            }
            File target = outputDir.dir(abi).get().asFile
            fs.sync {
                from archives.zipTree(jar)
                into target
                include '*.so'
            }
        }
    }
}

def copyGdxNatives = tasks.register('copyGdxNatives', CopyGdxNatives) {
    nativeJars.from(configurations.natives)
    outputDir = layout.buildDirectory.dir('gdx-natives')
}

tasks.matching { it.name ==~ /merge\w*JniLibFolders/ }.configureEach {
    dependsOn copyGdxNatives
}
