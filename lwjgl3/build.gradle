// lwjgl3: runs the game in a desktop window for development. Never shipped (TRD §2.3).
plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation project(':devtools')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// The baked assets (fonts, the pack) reach the desktop through the classpath (LLD §1.2).
sourceSets {
    main {
        resources {
            srcDirs += [rootProject.file('assets')]
        }
    }
}

application {
    mainClass = 'io.github.rameshkumark24.bazaarboss.lwjgl3.Lwjgl3Launcher'
}
